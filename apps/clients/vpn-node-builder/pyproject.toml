[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpn-node-builder"
version = "0.1.0"
description = "MyCS vpn-node-builder CLI (vpnb) — deploy and manage VPN node environments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "NovAssist" }]
dependencies = [
  "typer>=0.15.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
vpnb = "vpn_node_builder.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_node_builder"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.editable.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
