name: Build Bastion Images (prod)
concurrency: build-image-prod

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: Build arm64 qcow2 (skip by default — TCG is very slow without KVM on arm runners)
        type: choice
        options:
          - skip
          - build
        default: skip
  push:
    branches: [main]
    paths:
      - "image/build/**"
      - "image/packer/**"
      - "image/scripts/**"
      - "image/www/**"
      - ".github/workflows/build-image-prod.yml"

permissions:
  contents: write
  actions: write

jobs:
  assert-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::build-image-prod may only run on the 'main' branch (got ${GITHUB_REF_NAME})."
            exit 1
          fi

  create-release-tag:
    needs: assert-branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
      version: ${{ steps.release-tag.outputs.version }}
      bastion_image_name: ${{ steps.release-tag.outputs.bastion_image_name }}

    defaults:
      run:
        shell: bash

    env:
      MAJOR_VERSION: 0
      IMAGE_PREFIX: mycs-node-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need merge parents so generate-version.sh can detect merge source on main.
          fetch-depth: 0

      - name: Create release version
        id: release-tag
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          release_tag=$(cicd/scripts/generate-version.sh \
            -n "${IMAGE_PREFIX}" \
            -v "${MAJOR_VERSION}" \
            -b main)

          if [[ -z "${release_tag}" ]]; then
            echo "Failed to generate release tag"
            exit 1
          fi

          version=${release_tag#${IMAGE_PREFIX}_}
          bastion_image_name=${release_tag}

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bastion_image_name=${bastion_image_name}" >> "$GITHUB_OUTPUT"
          echo "Prod bastion version: ${version} → ${bastion_image_name}"

  build-aws-image:
    needs: create-release-tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: image

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      VERSION: ${{ needs.create-release-tag.outputs.version }}
      IS_DEV_BUILD: "no"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run build
        run: |
          build/build-aws-image.sh us-east-1 "$VERSION"

      - name: Publish image
        run: |
          build/publish-aws-image.sh us-east-1 "$VERSION"

  # Build matrix at runtime — job-level `if` cannot reference `matrix`.
  qcow2-matrix:
    needs: create-release-tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        run: |
          include='[{"arch":"amd64","runner":"ubuntu-24.04"}]'
          if [[ "${{ github.event.inputs.build_arm64 }}" == "build" ]]; then
            include='[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]'
          fi
          echo "include=${include}" >> "$GITHUB_OUTPUT"
          echo "qcow2 matrix: ${include}"

  build-qcow2-image:
    needs:
      - create-release-tag
      - qcow2-matrix
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.qcow2-matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash
        working-directory: image

    env:
      # Public qcow2 artifacts live in novassist-public (same DEV keys as local/dev uploads).
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      QCOW2_S3_BUCKET: novassist-public
      VERSION: ${{ needs.create-release-tag.outputs.version }}
      IS_DEV_BUILD: "no"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Install QEMU and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-utils qemu-efi-aarch64 \
            xorriso jq curl ca-certificates
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends gh
          fi

      - name: Enable KVM (GitHub nested virt)
        run: |
          # Official recipe: https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || echo "no /dev/kvm"

          qemu_bin=qemu-system-x86_64
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            qemu_bin=qemu-system-aarch64
          fi

          if [[ -r /dev/kvm && -w /dev/kvm ]] \
            && printf 'quit\n' | timeout 15 "$qemu_bin" \
                 -accel kvm -cpu host -machine none -m 32 \
                 -nographic -display none -nodefaults -monitor stdio \
                 >/tmp/qemu-kvm-smoke.out 2>/tmp/qemu-kvm-smoke.err; then
            echo "KVM smoke test OK ($qemu_bin)"
          else
            echo "::warning::KVM not usable; falling back to TCG"
            cat /tmp/qemu-kvm-smoke.err 2>/dev/null || true
            echo "QCOW2_ALLOW_TCG=1" >> "$GITHUB_ENV"
          fi

      - name: Build qcow2
        env:
          PACKER_LOG: "1"
          QCOW2_MEMORY: "4096"
          QCOW2_CPUS: "2"
        run: |
          build/build-qcow2-image.sh "$VERSION" "${{ matrix.arch }}"

      - name: Publish qcow2 to S3
        run: |
          build/publish-qcow2-image.sh "$VERSION" "${{ matrix.arch }}" prod

  tag_prod_build:
    needs:
      - create-release-tag
      - build-aws-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Push only the release tag (not the branch): --follow-tags races with other pushes.
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag release
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin

          last_commit_msg=$(git log -1 --pretty=%B)
          release_tag=${{ needs.create-release-tag.outputs.release_tag }}
          git tag -a "${release_tag}" -m "Bastion image prod release ${release_tag}: last commit => ${last_commit_msg}"
          git push origin "refs/tags/${release_tag}"

  trigger-vpn-node-builder:
    needs:
      - create-release-tag
      - build-aws-image
      - tag_prod_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Trigger vpn-node-builder Docker build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-vpn-node-builder-prod.yml
          ref: ${{ github.ref }}
          token: ${{ github.token }}
          inputs: |
            {
              "bastion_image_name": "${{ needs.create-release-tag.outputs.bastion_image_name }}"
            }
