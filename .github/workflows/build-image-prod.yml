name: Build Bastion Images (prod)
concurrency: build-image-prod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "image/build/**"
      - "image/packer/**"
      - "image/scripts/**"
      - "image/www/**"
      - ".github/workflows/build-image-prod.yml"

permissions:
  contents: write
  actions: write

jobs:
  assert-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::build-image-prod may only run on the 'main' branch (got ${GITHUB_REF_NAME})."
            exit 1
          fi

  create-release-tag:
    needs: assert-branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
      version: ${{ steps.release-tag.outputs.version }}
      bastion_image_name: ${{ steps.release-tag.outputs.bastion_image_name }}

    defaults:
      run:
        shell: bash

    env:
      MAJOR_VERSION: 0
      IMAGE_PREFIX: mycs-node-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need merge parents so generate-version.sh can detect merge source on main.
          fetch-depth: 0

      - name: Create release version
        id: release-tag
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          release_tag=$(cicd/scripts/generate-version.sh \
            -n "${IMAGE_PREFIX}" \
            -v "${MAJOR_VERSION}" \
            -b main)

          if [[ -z "${release_tag}" ]]; then
            echo "Failed to generate release tag"
            exit 1
          fi

          version=${release_tag#${IMAGE_PREFIX}_}
          bastion_image_name=${release_tag}

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bastion_image_name=${bastion_image_name}" >> "$GITHUB_OUTPUT"
          echo "Prod bastion version: ${version} → ${bastion_image_name}"

  build-aws-image:
    needs: create-release-tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: image

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      VERSION: ${{ needs.create-release-tag.outputs.version }}
      IS_DEV_BUILD: "no"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run build
        run: |
          build/build-aws-image.sh us-east-1 "$VERSION"

      - name: Publish image
        run: |
          build/publish-aws-image.sh us-east-1 "$VERSION"

  tag_prod_build:
    needs:
      - create-release-tag
      - build-aws-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Push only the release tag (not the branch): --follow-tags races with other pushes.
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag release
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin

          last_commit_msg=$(git log -1 --pretty=%B)
          release_tag=${{ needs.create-release-tag.outputs.release_tag }}
          git tag -a "${release_tag}" -m "Bastion image prod release ${release_tag}: last commit => ${last_commit_msg}"
          git push origin "refs/tags/${release_tag}"

  trigger-vpn-node-builder:
    needs:
      - create-release-tag
      - build-aws-image
      - tag_prod_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Trigger vpn-node-builder Docker build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-vpn-node-builder-prod.yml
          ref: ${{ github.ref }}
          token: ${{ github.token }}
          inputs: |
            {
              "bastion_image_name": "${{ needs.create-release-tag.outputs.bastion_image_name }}"
            }
