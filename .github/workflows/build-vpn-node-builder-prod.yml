name: Build vpn-node-builder (prod)
concurrency: vpn-node-builder-prod

on:
  workflow_dispatch:
    inputs:
      bastion_image_name:
        description: Bastion AMI name to bake in (default = latest mycs-node-image_X.Y.Z)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "apps/clients/vpn-node-builder/**"
      - "cloud/cookbook/**"
      - "libs/shared/app/golang/**"
      - ".github/workflows/build-vpn-node-builder-prod.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: novassist-ai/vpn-node-builder
  APP_PREFIX: vpnb
  MAJOR_VERSION: 0

permissions:
  contents: write
  packages: write

jobs:
  assert-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::build-vpn-node-builder-prod may only run on the 'main' branch (got ${GITHUB_REF_NAME})."
            exit 1
          fi

  create-release-tag:
    needs: assert-branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
      version: ${{ steps.release-tag.outputs.version }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release version
        id: release-tag
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          release_tag=$(cicd/scripts/generate-version.sh \
            -n "${APP_PREFIX}" \
            -v "${MAJOR_VERSION}" \
            -b main)

          if [[ -z "${release_tag}" ]]; then
            echo "Failed to generate release tag"
            exit 1
          fi

          version=${release_tag#${APP_PREFIX}_}
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Prod vpn-node-builder version: ${version} (git tag ${release_tag})"

  build-and-publish:
    needs: create-release-tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve bastion image name
        id: bastion
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          INPUT_BASTION: ${{ inputs.bastion_image_name }}
        run: |
          if [[ -n "${INPUT_BASTION}" ]]; then
            name="${INPUT_BASTION}"
          else
            name=$(bash apps/clients/vpn-node-builder/scripts/get-cloud-image.sh prod)
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Resolved bastion image: ${name}"

      - name: Resolve image tags
        id: tag
        env:
          VERSION: ${{ needs.create-release-tag.outputs.version }}
        run: |
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          version="${VERSION}"
          {
            echo "tags<<EOF"
            echo "${repo}:latest"
            echo "${repo}:${version}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "smoke=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/clients/vpn-node-builder/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.tag.outputs.tags }}
          build-args: |
            env=prod
            version=${{ steps.tag.outputs.version }}
            bastion_image_name=${{ steps.bastion.outputs.name }}
            bastion_image_owner=975050267636
            bastion_image_bucket_prefix=mycsimages
            bastion_image_storage_account_prefix=mycs
            bastion_image_container=nodeimage
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=MyCS vpn-node-builder CLI (prod)
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

      - name: Smoke test
        run: |
          docker pull "${{ steps.tag.outputs.smoke }}"
          docker run --rm "${{ steps.tag.outputs.smoke }}" --version
          docker run --rm "${{ steps.tag.outputs.smoke }}" --help
          docker run --rm "${{ steps.tag.outputs.smoke }}" doctor

  tag_prod_build:
    needs:
      - create-release-tag
      - build-and-publish
    if: github.ref == 'refs/heads/main' && needs.build-and-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag release
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin

          last_commit_msg=$(git log -1 --pretty=%B)
          release_tag=${{ needs.create-release-tag.outputs.release_tag }}
          git tag -a "${release_tag}" -m "vpn-node-builder prod release ${release_tag}: last commit => ${last_commit_msg}"
          git push origin "refs/tags/${release_tag}"

  # Bump stable Homebrew formula in novassist-ai/homebrew-tap after vpnb_X.Y.Z is published.
  # Requires repo secret HOMEBREW_TAP_TOKEN (PAT with contents:write on the tap).
  # Note: `secrets` cannot be referenced in job-level `if`; gate on the token in a step.
  bump-homebrew-formula:
    needs:
      - create-release-tag
      - tag_prod_build
    if: github.ref == 'refs/heads/main' && needs.tag_prod_build.result == 'success'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Require HOMEBREW_TAP_TOKEN
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping Homebrew formula bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout mycs-node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Checkout homebrew-tap
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: novassist-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Bump vpn-node-builder formula
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ needs.create-release-tag.outputs.release_tag }}
        run: |
          cicd/scripts/bump-homebrew-vpn-node-builder.sh \
            -t "${RELEASE_TAG}" \
            -d homebrew-tap \
            -r "${{ github.repository }}"

      - name: Commit and push tap
        if: steps.gate.outputs.skip != 'true'
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ needs.create-release-tag.outputs.release_tag }}
          VERSION: ${{ needs.create-release-tag.outputs.version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/vpn-node-builder.rb
          if git diff --staged --quiet; then
            echo "Formula already at ${RELEASE_TAG}; nothing to commit."
            exit 0
          fi
          git commit -m "vpn-node-builder ${VERSION}

          Bump stable formula to ${RELEASE_TAG} (launcher tarball).
          Docker channels remain :latest / :dev.
          "
          git push origin HEAD:main
