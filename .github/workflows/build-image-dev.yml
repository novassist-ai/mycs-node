name: Build Bastion Images (dev)
concurrency: build-image-dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "image/build/**"
      - "image/packer/**"
      - "image/scripts/**"
      - "image/www/**"
      - ".github/workflows/build-image-dev.yml"

permissions:
  contents: write
  actions: write

jobs:
  assert-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/dev" ]]; then
            echo "::error::build-image-dev may only run on the 'dev' branch (got ${GITHUB_REF_NAME})."
            exit 1
          fi

  create-build-tag:
    needs: assert-branch
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.build_tag.outputs.build_tag }}
      version: ${{ steps.build_tag.outputs.version }}
      bastion_image_name: ${{ steps.build_tag.outputs.bastion_image_name }}

    defaults:
      run:
        shell: bash

    env:
      MAJOR_VERSION: 0
      IMAGE_PREFIX: mycs-node-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build tag
        id: build_tag
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin

          build_tag=$(cicd/scripts/generate-version.sh \
            -n "${IMAGE_PREFIX}" \
            -v "${MAJOR_VERSION}" \
            -b "${GITHUB_REF_NAME}")

          if [[ -z "${build_tag}" ]]; then
            echo "Failed to generate build tag"
            exit 1
          fi

          version=${build_tag#${IMAGE_PREFIX}_}
          bastion_image_name=${build_tag}

          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bastion_image_name=${bastion_image_name}" >> "$GITHUB_OUTPUT"
          echo "Dev bastion version: ${version} → ${bastion_image_name}"

  build-aws-image:
    needs: create-build-tag
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: image

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DEV_BUILD: ${{ needs.create-build-tag.outputs.version }}
      IS_DEV_BUILD: yes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete prior dev AMIs
        run: |
          # AWS AMI name filter is a glob → mycs-node-image_*-dev*
          build/delete-aws-images.sh '*-dev*' "all"

      - name: Run build
        run: |
          build/build-aws-image.sh us-east-1 "$DEV_BUILD"

      - name: Publish image
        run: |
          build/publish-aws-image.sh us-east-1 "$DEV_BUILD" \
            "us-east-2 us-west-2 eu-west-1 eu-west-2 eu-central-2 af-south-1 ap-south-1 ap-southeast-1"

  build-qcow2-image:
    needs: create-build-tag
    if: github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash
        working-directory: image

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      QCOW2_S3_BUCKET: novassist-public
      DEV_BUILD: ${{ needs.create-build-tag.outputs.version }}
      IS_DEV_BUILD: yes
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Install QEMU and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-utils qemu-efi-aarch64 \
            xorriso jq curl ca-certificates
          # GitHub CLI (release artifact download)
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends gh
          fi

      - name: Check KVM (TCG fallback if unavailable)
        run: |
          if [[ -e /dev/kvm ]]; then
            echo "KVM available at /dev/kvm"
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm not present; using QCOW2_ALLOW_TCG=1 (slower)"
            echo "QCOW2_ALLOW_TCG=1" >> "$GITHUB_ENV"
          fi

      - name: Delete prior qcow2 objects (dev, this arch)
        run: |
          build/delete-qcow2-images.sh --all dev "${{ matrix.arch }}"

      - name: Build qcow2
        run: |
          build/build-qcow2-image.sh "$DEV_BUILD" "${{ matrix.arch }}"

      - name: Publish qcow2 to S3
        run: |
          build/publish-qcow2-image.sh "$DEV_BUILD" "${{ matrix.arch }}" dev

  tag_dev_build:
    needs:
      - create-build-tag
      - build-aws-image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Push only the build tag (not the branch): --follow-tags races with other pushes.
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag build
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin

          last_commit_msg=$(git log -1 --pretty=%B)
          build_tag=${{ needs.create-build-tag.outputs.build_tag }}
          git tag -a "${build_tag}" -m "Bastion image dev build ${build_tag}: last commit => ${last_commit_msg}"
          git push origin "refs/tags/${build_tag}"

  trigger-vpn-node-builder:
    needs:
      - create-build-tag
      - build-aws-image
      - tag_dev_build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Trigger vpn-node-builder Docker build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-vpn-node-builder-dev.yml
          ref: ${{ github.ref }}
          token: ${{ github.token }}
          inputs: |
            {
              "bastion_image_name": "${{ needs.create-build-tag.outputs.bastion_image_name }}"
            }
