name: Build Bastion Images (dev)
concurrency: build-image-dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "image/build/**"
      - "image/packer/**"
      - "image/scripts/**"
      - "image/www/**"
      - ".github/workflows/build-image-dev.yml"

permissions:
  contents: write
  actions: write

jobs:
  assert-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/dev" ]]; then
            echo "::error::build-image-dev may only run on the 'dev' branch (got ${GITHUB_REF_NAME})."
            exit 1
          fi

  create-build-tag:
    needs: assert-branch
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.build_tag.outputs.build_tag }}
      version: ${{ steps.build_tag.outputs.version }}
      bastion_image_name: ${{ steps.build_tag.outputs.bastion_image_name }}

    defaults:
      run:
        shell: bash

    env:
      MAJOR_VERSION: 0
      IMAGE_PREFIX: mycs-node-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build tag
        id: build_tag
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin

          build_tag=$(cicd/scripts/generate-version.sh \
            -n "${IMAGE_PREFIX}" \
            -v "${MAJOR_VERSION}" \
            -b "${GITHUB_REF_NAME}")

          if [[ -z "${build_tag}" ]]; then
            echo "Failed to generate build tag"
            exit 1
          fi

          version=${build_tag#${IMAGE_PREFIX}_}
          bastion_image_name=${build_tag}

          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bastion_image_name=${bastion_image_name}" >> "$GITHUB_OUTPUT"
          echo "Dev bastion version: ${version} → ${bastion_image_name}"

  build-aws-image:
    needs: create-build-tag
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: image

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DEV_BUILD: ${{ needs.create-build-tag.outputs.version }}
      IS_DEV_BUILD: yes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run build
        run: |
          build/build-aws-image.sh us-east-1 "$DEV_BUILD"

      - name: Publish image
        run: |
          build/publish-aws-image.sh us-east-1 "$DEV_BUILD" \
            "us-east-2 us-west-2 eu-west-1 eu-west-2 eu-central-2 af-south-1 ap-south-1 ap-southeast-1"

  tag_dev_build:
    needs:
      - create-build-tag
      - build-aws-image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Push only the build tag (not the branch): --follow-tags races with other pushes.
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag build
        run: |
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git fetch --tags origin

          last_commit_msg=$(git log -1 --pretty=%B)
          build_tag=${{ needs.create-build-tag.outputs.build_tag }}
          git tag -a "${build_tag}" -m "Bastion image dev build ${build_tag}: last commit => ${last_commit_msg}"
          git push origin "refs/tags/${build_tag}"

  trigger-vpn-node-builder:
    needs:
      - create-build-tag
      - build-aws-image
      - tag_dev_build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Trigger vpn-node-builder Docker build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build-vpn-node-builder-dev.yml
          ref: ${{ github.ref }}
          token: ${{ github.token }}
          inputs: |
            {
              "bastion_image_name": "${{ needs.create-build-tag.outputs.bastion_image_name }}"
            }
