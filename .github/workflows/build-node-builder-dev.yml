name: Build node-builder (dev)
concurrency: node-builder-dev

on:
  workflow_dispatch:
    inputs:
      bastion_image_name:
        description: Bastion AMI name to bake in (default = latest mycs-bastion_D.*)
        required: false
        type: string
  push:
    branches: [dev]
    paths:
      - "apps/clients/node-builder/**"
      - "cloud/cookbook/**"
      - "libs/shared/app/golang/**"
      - ".github/workflows/build-node-builder-dev.yml"
  pull_request:
    branches: [dev]
    paths:
      - "apps/clients/node-builder/**"
      - "cloud/cookbook/**"
      - "libs/shared/app/golang/**"
      - ".github/workflows/build-node-builder-dev.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: novassist-ai/node-builder

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve bastion image name
        id: bastion
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          INPUT_BASTION: ${{ inputs.bastion_image_name }}
        run: |
          if [[ -n "${INPUT_BASTION}" ]]; then
            name="${INPUT_BASTION}"
          else
            name=$(bash apps/clients/node-builder/scripts/get-cloud-image.sh ci)
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Resolved bastion image: ${name}"

      - name: Publish mode
        id: meta
        run: |
          full="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "load=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "tags=node-builder:dev" >> "$GITHUB_OUTPUT"
            echo "smoke=node-builder:dev" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "load=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "tags=${full}" >> "$GITHUB_OUTPUT"
            echo "smoke=${full}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.meta.outputs.push == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/clients/node-builder/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          load: ${{ steps.meta.outputs.load }}
          platforms: ${{ steps.meta.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            env=dev
            version=dev
            bastion_image_name=${{ steps.bastion.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=MyCS node-builder CLI (dev)

      - name: Smoke test
        run: |
          if [[ "${{ steps.meta.outputs.push }}" == "true" ]]; then
            docker pull "${{ steps.meta.outputs.smoke }}"
          fi
          docker run --rm "${{ steps.meta.outputs.smoke }}" --version
          docker run --rm "${{ steps.meta.outputs.smoke }}" --help
          docker run --rm "${{ steps.meta.outputs.smoke }}" doctor
